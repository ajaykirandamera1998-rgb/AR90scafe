<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brahmanandam Meme WebAR</title>
    
    <!-- A-Frame & AR.js Libraries -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      #play-btn {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        padding: 12px 26px;
        background: #00E5FF;
        color: #000;
        border: none;
        border-radius: 25px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.5px;
        box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        cursor: pointer;
        display: none;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden; background-color: #000;">

    <!-- Audio Unmute Trigger -->
    <button id="play-btn">🔊 TAP TO UNMUTE AUDIO</button>

    <a-scene embedded arjs="patternRatio: 0.90; trackingMethod: best;" vr-mode-ui="enabled: false">
      
      <a-assets>
        <video id="vid1" src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video1.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid2" src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video2.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid3" src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video3.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid4" src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video4.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-marker id="marker" type="pattern" url="./marker.patt" smooth="true" smoothCount="5">

        <!-- MINIMAL STACK CONTAINER -->
        <a-entity id="minimal-stack" scale="0.5 0.5 0.5" position="0 0.02 0" rotation="-90 0 0">
          
          <!-- 1. MAIN VIDEO PLAYER (Clean - No Border) -->
          <a-video 
            id="main-player" 
            src="#vid1" 
            width="1.6" 
            height="0.9" 
            position="0 0.55 0">
          </a-video>

          <!-- 2. MIDDLE SEPARATION LINE (Cyan) -->
          <a-entity 
            geometry="primitive: plane; width: 1.6; height: 0.012" 
            material="color: #00E5FF; shader: flat" 
            position="0 0.04 0">
          </a-entity>

          <!-- 3. SUB THUMBNAIL STRIP (Clean - No Borders) -->
          
          <!-- Sub Video 1 -->
          <a-video 
            id="sub1" 
            class="sub-player clickable" 
            src="#vid2" 
            width="0.47" 
            height="0.29" 
            position="-0.55 -0.2 0">
          </a-video>

          <!-- Sub Video 2 -->
          <a-video 
            id="sub2" 
            class="sub-player clickable" 
            src="#vid3" 
            width="0.47" 
            height="0.29" 
            position="0 -0.2 0">
          </a-video>

          <!-- Sub Video 3 -->
          <a-video 
            id="sub3" 
            class="sub-player clickable" 
            src="#vid4" 
            width="0.47" 
            height="0.29" 
            position="0.55 -0.2 0">
          </a-video>

        </a-entity>

      </a-marker>

      <!-- Raycaster for Mobile Touch -->
      <a-entity camera cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-scene>

    <script>
      const mainPlayer = document.getElementById("main-player");
      const subPlayers = document.querySelectorAll(".sub-player");
      const marker = document.getElementById("marker");
      const playBtn = document.getElementById("play-btn");

      const videoIds = ["vid1", "vid2", "vid3", "vid4"];

      // Audio activation handler
      playBtn.addEventListener("click", () => {
        videoIds.forEach(id => {
          const v = document.getElementById(id);
          v.muted = false;
          v.play().catch(e => console.log(e));
        });
        playBtn.style.display = "none";
      });

      // Marker track trigger
      marker.addEventListener("markerFound", () => {
        videoIds.forEach(id => {
          document.getElementById(id).play().catch(e => console.log(e));
        });
        if (document.getElementById("vid1").muted) {
          playBtn.style.display = "block";
        }
      });

      // Marker lost trigger
      marker.addEventListener("markerLost", () => {
        videoIds.forEach(id => document.getElementById(id).pause());
        playBtn.style.display = "none";
      });

      // Swap Main and Sub video sources on tap
      subPlayers.forEach(sub => {
        sub.addEventListener("click", function() {
          const currentMainVidSrc = mainPlayer.getAttribute("src");
          const tappedSubVidSrc = this.getAttribute("src");

          mainPlayer.setAttribute("src", tappedSubVidSrc);
          this.setAttribute("src", currentMainVidSrc);

          // Force WebGL map texture refresh
          mainPlayer.components.material.material.map.needsUpdate = true;
          this.components.material.material.map.needsUpdate = true;
        });
      });
    </script>
  </body>
</html>
