<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>MEMEVERSE</title>
    <link rel="stylesheet" href="styles.css" />
    
    <!-- A-Frame & AR.js Libraries -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body>
    <a-scene embedded arjs="patternRatio:0.90" vr-mode-ui="enabled: false">
      <a-marker 
        type="pattern" 
        url="./marker.patt"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">
        
        <!-- Scaled down radius to 0.3 (approx 60cm wide) and raised on Y-axis (0.3) -->
        <a-sphere position="0 0.3 0" radius="0.3" color="#EF2D5E"></a-sphere>

      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
