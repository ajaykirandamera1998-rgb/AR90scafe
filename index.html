<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEMEVERSE WebAR - Holographic Demo</title>
    
    <!-- A-Frame & AR.js Libraries -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      #play-btn {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        padding: 14px 28px;
        background: #EF2D5E;
        color: white;
        border: none;
        border-radius: 30px;
        font-family: sans-serif;
        font-weight: bold;
        font-size: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        cursor: pointer;
        display: none;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <button id="play-btn">🔊 Tap for Sound</button>

    <a-scene embedded arjs="patternRatio: 0.90; trackingMethod: best;" vr-mode-ui="enabled: false">
      
      <a-assets>
        <video id="vid1" src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video1.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid2" src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video2.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid3" src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video3.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid4" src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video4.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-marker id="marker" type="pattern" url="./marker.patt" smooth="true" smoothCount="5">

        <!-- Floating Layout Container (Scaled down & rotated flat over card) -->
        <a-entity id="hologram-layout" scale="0.75 0.75 0.75" position="0 0.1 0" rotation="-90 0 0">
          
          <!-- MAIN VIDEO PLAYER (Top) -->
          <a-video 
            id="main-player" 
            src="#vid1" 
            width="1.9" 
            height="1.1" 
            position="0 0.65 0">
          </a-video>

          <!-- SUB VIDEO PLAYERS (Bottom Row - All 4 Playing) -->
          <a-video 
            id="sub1"
            class="sub-player clickable"
            src="#vid2" 
            width="0.58" 
            height="0.8" 
            position="-0.62 -0.45 0">
          </a-video>

          <a-video 
            id="sub2"
            class="sub-player clickable"
            src="#vid3" 
            width="0.58" 
            height="0.8" 
            position="0 -0.45 0">
          </a-video>

          <a-video 
            id="sub3"
            class="sub-player clickable"
            src="#vid4" 
            width="0.58" 
            height="0.8" 
            position="0.62 -0.45 0">
          </a-video>

        </a-entity>

      </a-marker>

      <!-- Raycaster enabled for touch interaction -->
      <a-entity camera cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-scene>

    <script>
      const mainPlayer = document.getElementById("main-player");
      const subPlayers = document.querySelectorAll(".sub-player");
      const marker = document.getElementById("marker");
      const playBtn = document.getElementById("play-btn");

      const videoIds = ["vid1", "vid2", "vid3", "vid4"];

      // Unmute and play all sound on tap
      playBtn.addEventListener("click", () => {
        videoIds.forEach(id => {
          const v = document.getElementById(id);
          v.muted = false;
          v.play().catch(e => console.log(e));
        });
        playBtn.style.display = "none";
      });

      // Play all 4 videos when marker is scanned
      marker.addEventListener("markerFound", () => {
        videoIds.forEach(id => {
          const v = document.getElementById(id);
          v.play().catch(e => console.log(e));
        });
        
        // Show audio button if any video is muted
        if (document.getElementById("vid1").muted) {
          playBtn.style.display = "block";
        }
      });

      // Pause all when marker is lost
      marker.addEventListener("markerLost", () => {
        videoIds.forEach(id => {
          document.getElementById(id).pause();
        });
        playBtn.style.display = "none";
      });

      // Interactive Video Swap on Tap
      subPlayers.forEach(sub => {
        sub.addEventListener("click", function() {
          const currentMainVidSrc = mainPlayer.getAttribute("src");
          const tappedSubVidSrc = this.getAttribute("src");

          // Swap video targets
          mainPlayer.setAttribute("src", tappedSubVidSrc);
          this.setAttribute("src", currentMainVidSrc);

          // Force material refresh on WebGL planes
          mainPlayer.components.material.material.map.needsUpdate = true;
          this.components.material.material.map.needsUpdate = true;
        });
      });
    </script>
  </body>
</html>
