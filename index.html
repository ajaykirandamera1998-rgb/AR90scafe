<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEMEVERSE WebAR</title>
    
    <!-- A-Frame & AR.js -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      #overlay-btn {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        padding: 14px 28px;
        background: #EF2D5E;
        color: white;
        border: none;
        border-radius: 30px;
        font-family: sans-serif;
        font-weight: bold;
        font-size: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        cursor: pointer;
        display: none;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <button id="overlay-btn">🔊 Tap to Enable Audio</button>

    <a-scene embedded arjs="patternRatio: 0.90; trackingMethod: best;" vr-mode-ui="enabled: false">
      
      <a-assets>
        <!-- Single dynamic video element -->
        <video 
          id="main-video-asset" 
          src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video1.mp4" 
          preload="auto" 
          crossorigin="anonymous" 
          loop 
          playsinline 
          webkit-playsinline 
          muted>
        </video>
      </a-assets>

      <a-marker id="marker" type="pattern" url="./marker.patt" smooth="true" smoothCount="5">

        <!-- Container elevated to z=0.05 to eliminate background clipping -->
        <a-entity id="layout" scale="0.75 0.75 0.75" position="0 0.05 0" rotation="-90 0 0">
          
          <!-- White Card Frame -->
          <a-plane color="#FFFFFF" width="2.1" height="2.6" position="0 0 0"></a-plane>

          <!-- Main Player Plane (Elevated slightly to z=0.02 to avoid z-fighting) -->
          <a-video 
            id="main-player" 
            src="#main-video-asset" 
            width="1.9" 
            height="1.1" 
            position="0 0.65 0.02">
          </a-video>

          <!-- Sub Clickable Items (Using distinct video sources mapped on tap) -->
          <a-plane 
            class="sub-item clickable" 
            data-src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video2.mp4"
            color="#111111" width="0.58" height="0.8" position="-0.62 -0.65 0.02">
            <a-text value="VID 2" align="center" position="0 0 0.01" scale="0.8 0.8 0.8" color="#FFFFFF"></a-text>
          </a-plane>

          <a-plane 
            class="sub-item clickable" 
            data-src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video3.mp4"
            color="#111111" width="0.58" height="0.8" position="0 -0.65 0.02">
            <a-text value="VID 3" align="center" position="0 0 0.01" scale="0.8 0.8 0.8" color="#FFFFFF"></a-text>
          </a-plane>

          <a-plane 
            class="sub-item clickable" 
            data-src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video4.mp4"
            color="#111111" width="0.58" height="0.8" position="0.62 -0.65 0.02">
            <a-text value="VID 4" align="center" position="0 0 0.01" scale="0.8 0.8 0.8" color="#FFFFFF"></a-text>
          </a-plane>

        </a-entity>

      </a-marker>

      <!-- Raycaster enabled specifically for mobile touch -->
      <a-entity camera cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-scene>

    <script>
      const videoAsset = document.getElementById("main-video-asset");
      const mainPlayer = document.getElementById("main-player");
      const marker = document.getElementById("marker");
      const overlayBtn = document.getElementById("overlay-btn");
      const subItems = document.querySelectorAll(".sub-item");

      // 1. Audio Unmute Gesture
      overlayBtn.addEventListener("click", () => {
        videoAsset.muted = false;
        videoAsset.play().catch(e => console.log(e));
        overlayBtn.style.display = "none";
      });

      // 2. Marker Found / Lost Event Logic
      marker.addEventListener("markerFound", () => {
        videoAsset.play().catch(e => console.log(e));
        if (videoAsset.muted) {
          overlayBtn.style.display = "block";
        }
      });

      marker.addEventListener("markerLost", () => {
        videoAsset.pause();
        overlayBtn.style.display = "none";
      });

      // 3. Reliable Video Source Swapping
      subItems.forEach(item => {
        item.addEventListener("click", function() {
          const newSrc = this.getAttribute("data-src");
          
          // Pause current playback
          videoAsset.pause();

          // Swap source directly on HTML video element
          videoAsset.src = newSrc;
          videoAsset.load();

          // Refresh WebGL texture material mapping
          mainPlayer.components.material.material.map.needsUpdate = true;

          // Play new video
          videoAsset.play().catch(e => console.log(e));
        });
      });
    </script>
  </body>
</html>
