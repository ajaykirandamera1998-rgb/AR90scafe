<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEMEVERSE WebAR - Holographic Demo</title>
    
    <!-- A-Frame & AR.js Libraries -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      #play-btn {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        padding: 14px 28px;
        background: #00E5FF;
        color: #000;
        border: none;
        border-radius: 30px;
        font-family: sans-serif;
        font-weight: bold;
        font-size: 15px;
        box-shadow: 0 4px 15px rgba(0,229,255,0.4);
        cursor: pointer;
        display: none;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <button id="play-btn">🔊 Tap to Enable Audio</button>

    <a-scene embedded arjs="patternRatio: 0.90; trackingMethod: best;" vr-mode-ui="enabled: false">
      
      <a-assets>
        <video id="vid1" src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video1.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid2" src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video2.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid3" src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video3.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid4" src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video4.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-marker id="marker" type="pattern" url="./marker.patt" smooth="true" smoothCount="5">

        <!-- Floating Layout Container -->
        <a-entity id="hologram-layout" scale="0.75 0.75 0.75" position="0 0.1 0" rotation="-90 0 0">
          
          <!-- MAIN VIDEO PLAYER (Top) -->
          <a-entity position="0 0.65 0">
            <!-- Wireframe Border Box -->
            <a-entity 
              geometry="primitive: box; width: 1.94; height: 1.14; depth: 0.01" 
              material="wireframe: true; color: #00E5FF; wireframeLinewidth: 2"
              position="0 0 -0.005">
            </a-entity>

            <!-- Video Texture -->
            <a-video 
              id="main-player" 
              src="#vid1" 
              width="1.9" 
              height="1.1" 
              position="0 0 0">
            </a-video>
          </a-entity>

          <!-- SUB VIDEO PLAYERS (Bottom Row - All 4 Playing Demo) -->
          
          <!-- Sub 1 -->
          <a-entity position="-0.62 -0.45 0">
            <a-entity 
              geometry="primitive: box; width: 0.61; height: 0.83; depth: 0.01" 
              material="wireframe: true; color: #FFFFFF; wireframeLinewidth: 2"
              position="0 0 -0.005">
            </a-entity>
            <a-video 
              id="sub1"
              class="sub-player clickable"
              src="#vid2" 
              width="0.58" 
              height="0.8" 
              position="0 0 0">
            </a-video>
          </a-entity>

          <!-- Sub 2 -->
          <a-entity position="0 -0.45 0">
            <a-entity 
              geometry="primitive: box; width: 0.61; height: 0.83; depth: 0.01" 
              material="wireframe: true; color: #FFFFFF; wireframeLinewidth: 2"
              position="0 0 -0.005">
            </a-entity>
            <a-video 
              id="sub2"
              class="sub-player clickable"
              src="#vid3" 
              width="0.58" 
              height="0.8" 
              position="0 0 0">
            </a-video>
          </a-entity>

          <!-- Sub 3 -->
          <a-entity position="0.62 -0.45 0">
            <a-entity 
              geometry="primitive: box; width: 0.61; height: 0.83; depth: 0.01" 
              material="wireframe: true; color: #FFFFFF; wireframeLinewidth: 2"
              position="0 0 -0.005">
            </a-entity>
            <a-video 
              id="sub3"
              class="sub-player clickable"
              src="#vid4" 
              width="0.58" 
              height="0.8" 
              position="0 0 0">
            </a-video>
          </a-entity>

        </a-entity>

      </a-marker>

      <!-- Touch Raycaster -->
      <a-entity camera cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
    </a-scene>

    <script>
      const mainPlayer = document.getElementById("main-player");
      const subPlayers = document.querySelectorAll(".sub-player");
      const marker = document.getElementById("marker");
      const playBtn = document.getElementById("play-btn");

      const videoIds = ["vid1", "vid2", "vid3", "vid4"];

      // Audio activation gesture handler
      playBtn.addEventListener("click", () => {
        videoIds.forEach(id => {
          const v = document.getElementById(id);
          v.muted = false;
          v.play().catch(e => console.log(e));
        });
        playBtn.style.display = "none";
      });

      // Play all 4 videos on marker tracking trigger
      marker.addEventListener("markerFound", () => {
        videoIds.forEach(id => {
          const v = document.getElementById(id);
          v.play().catch(e => console.log(e));
        });
        
        if (document.getElementById("vid1").muted) {
          playBtn.style.display = "block";
        }
      });

      // Pause playback when marker tracking is lost
      marker.addEventListener("markerLost", () => {
        videoIds.forEach(id => {
          document.getElementById(id).pause();
        });
        playBtn.style.display = "none";
      });

      // Interactive Swap Handler
      subPlayers.forEach(sub => {
        sub.addEventListener("click", function() {
          const currentMainVidSrc = mainPlayer.getAttribute("src");
          const tappedSubVidSrc = this.getAttribute("src");

          mainPlayer.setAttribute("src", tappedSubVidSrc);
          this.setAttribute("src", currentMainVidSrc);

          // Refresh textures dynamically inside WebGL buffer
          mainPlayer.components.material.material.map.needsUpdate = true;
          this.components.material.material.map.needsUpdate = true;
        });
      });
    </script>
  </body>
</html>
