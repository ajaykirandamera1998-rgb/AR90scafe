<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>MEMEVERSE WebAR - Multi-Target Engine</title>

    <!-- A-Frame & AR.js Libraries -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      #audio-toggle-btn {
        position: fixed;
        bottom: 24px;
        right: 20px;
        z-index: 999999;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 20px;
        background: rgba(0, 0, 0, 0.85);
        color: #00E5FF;
        border: 2px solid #00E5FF;
        border-radius: 30px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: all 0.2s ease;
      }

      #audio-toggle-btn.unmuted {
        background: #00E5FF;
        color: #000;
        box-shadow: 0 4px 20px rgba(0, 229, 255, 0.7);
      }

      #audio-toggle-btn:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden; background-color: #000;">

    <button id="audio-toggle-btn" onclick="toggleScreenAudio()">
      <span id="audio-icon">🔇</span>
      <span id="audio-label">TAP TO UNMUTE</span>
    </button>

    <!-- Higher smoothTolerance parameters for stable tracking -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.90; trackingMethod: best;" vr-mode-ui="enabled: false">

      <a-assets timeout="10000">
        <video id="vid-jathirathnalu" src="videos/Jathirathnalu.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid-meme" src="videos/Meme.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid-sapthagiri" src="videos/Sapthagiri.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid-vm" src="videos/VM.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid-video" src="videos/video.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
      </a-assets>

      <!-- 1. Jathirathnalu Target -->
      <a-marker id="marker-jathirathnalu" type="pattern" url="./Markers/Jathirathnalu marker.patt" smooth="true" smoothCount="15" smoothTolerance="0.05" smoothThreshold="5">
        <a-entity position="0 0.05 0" rotation="-90 0 0">
          <a-video src="#vid-jathirathnalu" width="0.7" height="0.393" position="0 0 0"></a-video>
        </a-entity>
      </a-marker>

      <!-- 2. Meme Target -->
      <a-marker id="marker-meme" type="pattern" url="./Markers/Meme marker.patt" smooth="true" smoothCount="15" smoothTolerance="0.05" smoothThreshold="5">
        <a-entity position="0 0.05 0" rotation="-90 0 0">
          <a-video src="#vid-meme" width="0.7" height="0.393" position="0 0 0"></a-video>
        </a-entity>
      </a-marker>

      <!-- 3. Sapthagiri Target -->
      <a-marker id="marker-sapthagiri" type="pattern" url="./Markers/Sapthgiri marker.patt" smooth="true" smoothCount="15" smoothTolerance="0.05" smoothThreshold="5">
        <a-entity position="0 0.05 0" rotation="-90 0 0">
          <a-video src="#vid-sapthagiri" width="0.7" height="0.393" position="0 0 0"></a-video>
        </a-entity>
      </a-marker>

      <!-- 4. VM Target -->
      <a-marker id="marker-vm" type="pattern" url="./Markers/VM marker.patt" smooth="true" smoothCount="15" smoothTolerance="0.05" smoothThreshold="5">
        <a-entity position="0 0.05 0" rotation="-90 0 0">
          <a-video src="#vid-vm" width="0.7" height="0.393" position="0 0 0"></a-video>
        </a-entity>
      </a-marker>

      <!-- 5. Video Target -->
      <a-marker id="marker-video" type="pattern" url="./Markers/Video marker.patt" smooth="true" smoothCount="15" smoothTolerance="0.05" smoothThreshold="5">
        <a-entity position="0 0.05 0" rotation="-90 0 0">
          <a-video src="#vid-video" width="0.7" height="0.393" position="0 0 0"></a-video>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const targets = [
        { markerId: "marker-jathirathnalu", videoId: "vid-jathirathnalu" },
        { markerId: "marker-meme", videoId: "vid-meme" },
        { markerId: "marker-sapthagiri", videoId: "vid-sapthagiri" },
        { markerId: "marker-vm", videoId: "vid-vm" },
        { markerId: "marker-video", videoId: "vid-video" }
      ];

      const btn = document.getElementById("audio-toggle-btn");
      const icon = document.getElementById("audio-icon");
      const label = document.getElementById("audio-label");

      let activeVideo = null;
      let isGlobalUnmuted = false;
      const loseTimeoutMap = new Map();

      function toggleScreenAudio() {
        isGlobalUnmuted = !isGlobalUnmuted;

        targets.forEach(t => {
          const v = document.getElementById(t.videoId);
          v.muted = !isGlobalUnmuted;
          v.volume = 1.0;
        });

        if (isGlobalUnmuted) {
          btn.classList.add("unmuted");
          icon.textContent = "🔊";
          label.textContent = "AUDIO ON";
          if (activeVideo) activeVideo.play().catch(e => console.log(e));
        } else {
          btn.classList.remove("unmuted");
          icon.textContent = "🔇";
          label.textContent = "TAP TO UNMUTE";
        }
      }

      targets.forEach(t => {
        const markerEl = document.getElementById(t.markerId);
        const videoEl = document.getElementById(t.videoId);

        markerEl.addEventListener("markerFound", () => {
          // Clear any pending loss timeout if marker is found again quickly
          if (loseTimeoutMap.has(t.markerId)) {
            clearTimeout(loseTimeoutMap.get(t.markerId));
            loseTimeoutMap.delete(t.markerId);
          }

          activeVideo = videoEl;
          videoEl.muted = !isGlobalUnmuted;
          videoEl.play().catch(e => console.log(e));
        });

        markerEl.addEventListener("markerLost", () => {
          // Wait 1200ms before pausing to smooth out camera jitter
          const timeout = setTimeout(() => {
            videoEl.pause();
            videoEl.currentTime = 0;
            if (activeVideo === videoEl) activeVideo = null;
            loseTimeoutMap.delete(t.markerId);
          }, 1200);

          loseTimeoutMap.set(t.markerId, timeout);
        });
      });
    </script>
  </body>
</html>
