<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>MEMEVERSE WebAR - Multi-Target Engine</title>

    <!-- A-Frame & AR.js Libraries -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      /* Audio Unmute Overlay Button */
      #play-btn {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        padding: 12px 26px;
        background: #00E5FF;
        color: #000;
        border: none;
        border-radius: 25px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.5px;
        box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        cursor: pointer;
        display: none;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden; background-color: #000;">

    <!-- Tap to Unmute Button -->
    <button id="play-btn">🔊 TAP FOR AUDIO</button>

    <a-scene embedded arjs="patternRatio:0.90; trackingMethod: best;" vr-mode-ui="enabled: false">

      <a-assets timeout="10000">
        <video id="vid-jathirathnalu" src="videos/Jathirathnalu.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid-meme" src="videos/Meme.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid-sapthagiri" src="videos/Sapthagiri.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid-vm" src="videos/VM.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
        <video id="vid-video" src="videos/video.mp4" preload="auto" crossorigin="anonymous" loop playsinline webkit-playsinline muted></video>
      </a-assets>

      <!-- 1. Jathirathnalu Target -->
      <a-marker 
        id="marker-jathirathnalu"
        type="pattern" 
        url="./Markers/Jathirathnalu marker.patt"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">
        <a-video src="#vid-jathirathnalu" width="1.0" height="0.56" position="0 0.05 0" rotation="-90 0 0"></a-video>
      </a-marker>

      <!-- 2. Meme Target -->
      <a-marker 
        id="marker-meme"
        type="pattern" 
        url="./Markers/Meme marker.patt"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">
        <a-video src="#vid-meme" width="1.0" height="0.56" position="0 0.05 0" rotation="-90 0 0"></a-video>
      </a-marker>

      <!-- 3. Sapthagiri Target -->
      <a-marker 
        id="marker-sapthagiri"
        type="pattern" 
        url="./Markers/Sapthgiri marker.patt"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">
        <a-video src="#vid-sapthagiri" width="1.0" height="0.56" position="0 0.05 0" rotation="-90 0 0"></a-video>
      </a-marker>

      <!-- 4. VM Target -->
      <a-marker 
        id="marker-vm"
        type="pattern" 
        url="./Markers/VM marker.patt"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">
        <a-video src="#vid-vm" width="1.0" height="0.56" position="0 0.05 0" rotation="-90 0 0"></a-video>
      </a-marker>

      <!-- 5. Video Target -->
      <a-marker 
        id="marker-video"
        type="pattern" 
        url="./Markers/Video marker.patt"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">
        <a-video src="#vid-video" width="1.0" height="0.56" position="0 0.05 0" rotation="-90 0 0"></a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const targets = [
        { markerId: "marker-jathirathnalu", videoId: "vid-jathirathnalu" },
        { markerId: "marker-meme", videoId: "vid-meme" },
        { markerId: "marker-sapthagiri", videoId: "vid-sapthagiri" },
        { markerId: "marker-vm", videoId: "vid-vm" },
        { markerId: "marker-video", videoId: "vid-video" }
      ];

      const playBtn = document.getElementById("play-btn");
      let activeVideo = null;

      // Global Unmute Trigger
      playBtn.addEventListener("click", () => {
        targets.forEach(t => {
          const v = document.getElementById(t.videoId);
          v.muted = false;
        });
        if (activeVideo) {
          activeVideo.play().catch(e => console.log(e));
        }
        playBtn.style.display = "none";
      });

      // Bind tracking events dynamically to each marker
      targets.forEach(t => {
        const markerEl = document.getElementById(t.markerId);
        const videoEl = document.getElementById(t.videoId);

        markerEl.addEventListener("markerFound", () => {
          activeVideo = videoEl;
          videoEl.play().catch(e => console.log(e));

          if (videoEl.muted) {
            playBtn.style.display = "block";
          }
        });

        markerEl.addEventListener("markerLost", () => {
          videoEl.pause();
          videoEl.currentTime = 0;
          if (activeVideo === videoEl) {
            activeVideo = null;
          }
          playBtn.style.display = "none";
        });
      });
    </script>
  </body>
</html>
