<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>MEMEVERSE</title>
    <link rel="stylesheet" href="styles.css" />
    
    <!-- A-Frame & AR.js Libraries -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      /* Audio Unmute Overlay Button */
      #play-btn {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        padding: 12px 24px;
        background-color: #EF2D5E;
        color: white;
        border: none;
        border-radius: 25px;
        font-family: sans-serif;
        font-weight: bold;
        font-size: 16px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        cursor: pointer;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- Tap to Unmute Button -->
    <button id="play-btn">🔊 Tap for Sound</button>

    <a-scene embedded arjs="patternRatio:0.90" vr-mode-ui="enabled: false">
      
      <a-assets>
        <video 
          id="video" 
          src="https://raw.githubusercontent.com/ajaykirandamera1998-rgb/WebAr/main/videos/video1.mp4"
          preload="auto" 
          crossorigin="anonymous"
          loop
          playsinline
          webkit-playsinline
          muted>
        </video>
      </a-assets>

      <a-marker 
        id="marker"
        type="pattern" 
        url="./marker.patt"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">

        <!-- Scaled down width=1.0 & height=0.56 to match standard 16:9 business card proportions -->
        <a-video 
          src="#video" 
          width="1.0" 
          height="0.56" 
          position="0 0.05 0" 
          rotation="-90 0 0">
        </a-video>

      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const video = document.getElementById("video");
      const marker = document.getElementById("marker");
      const playBtn = document.getElementById("play-btn");

      // Handle user click to enable audio
      playBtn.addEventListener("click", () => {
        video.muted = false;
        video.play();
        playBtn.style.display = "none"; // Hide button once audio is activated
      });

      // Play video (muted by default) when card is in view
      marker.addEventListener("markerFound", () => {
        video.play();
      });

      // Pause when card leaves view
      marker.addEventListener("markerLost", () => {
        video.pause();
      });
    </script>
  </body>
</html>
